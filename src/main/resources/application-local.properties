# Local development profile: embedded H2 database (PostgreSQL compatibility mode),
# persisted to ./data/. Run with: mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:file:./data/classtracker;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
